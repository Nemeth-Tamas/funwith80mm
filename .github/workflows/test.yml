name: Thermal Chaos tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask Pillow
      - name: Run receipt generation tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test camera browser workflow (mocked devices and printer)
        run: node --test tests/test_camera_ui.cjs
